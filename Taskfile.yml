version: "3"

tasks:
  sync:
    desc: Установить зависимости
    cmd: uv sync

  run:
    desc: Запустить бота
    cmd: uv run python src/main.py

  clean:
    desc: Удалить все __pycache__ директории
    cmd: python -c "import shutil, pathlib; [shutil.rmtree(p) for p in pathlib.Path('.').rglob('__pycache__')]"

  seed:
    desc: Наполнить БД тестовыми данными (--count N, по умолчанию 500)
    cmd: uv run python seed/seed.py {{.CLI_ARGS}}

  default:
    desc: Синхронизировать зависимости и запустить бота
    cmds:
      - task: sync
      - task: run
